name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: python -m ingredient_matcher.data
      - run: pytest -q
      - name: Evaluate frozen benchmark
        run: >-
          python -m ingredient_matcher.evaluate
          --methods fuzzy,fine_tuned
          --fine-tuned-model BrisaTielly/ingredient-matcher-ptbr-model
          --results-dir .ci-results
      - name: Block metric regressions
        run: >-
          python scripts/check_regression.py
          --baseline results/metrics.json
          --candidate .ci-results/metrics.json
          --method RapidFuzz
          --method 'E5 fine-tuned'
      - name: Evaluate reviewed Open Prices slice
        run: >-
          python scripts/evaluate_real.py
          --methods fuzzy,fine_tuned
          --fine-tuned-model BrisaTielly/ingredient-matcher-ptbr-model
          --results-dir ci-real-results
      - name: Upload real-data evaluation
        uses: actions/upload-artifact@v4
        with:
          name: real-open-prices-evaluation
          path: ci-real-results
      - run: ruff check .
